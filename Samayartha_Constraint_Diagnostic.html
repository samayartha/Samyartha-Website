<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Constraint Diagnostic — Samayartha Advisory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16324A;
    --ink-70: rgba(22,50,74,0.7);
    --paper:#F2F0E8;
    --paper-raised:#FAF9F4;
    --brass:#C89B3C;
    --rust:#B0392D;
    --slate:#5C6670;
    --hair:#D9D4C6;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:48px 24px 80px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--slate);
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--hair);
    padding-bottom:14px;
    margin-bottom:32px;
  }
  .eyebrow .brand{ color:var(--ink); font-weight:600; }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:clamp(26px,4vw,34px);
    line-height:1.15;
    letter-spacing:-0.01em;
    margin:0 0 12px;
  }
  .lede{
    color:var(--ink-70);
    font-size:17px;
    line-height:1.6;
    margin:0 0 36px;
    max-width:52ch;
  }

  /* Progress ticks — instrument-panel style, not a percent bar */
  .ticks{
    display:flex;
    gap:4px;
    margin-bottom:8px;
  }
  .tick{
    flex:1;
    height:6px;
    background:var(--hair);
    border-radius:1px;
    transition:background .35s ease;
  }
  .tick.done{ background:var(--ink); }
  .tick.current{ background:var(--brass); }
  .progress-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--slate);
    letter-spacing:.06em;
    margin-bottom:28px;
  }

  /* Section divider card */
  .section-card{
    background:var(--paper-raised);
    border:1px solid var(--hair);
    border-left:3px solid var(--ink);
    padding:22px 24px;
    margin-bottom:28px;
    border-radius:var(--radius);
  }
  .section-card .num{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--brass);
    letter-spacing:.1em;
    text-transform:uppercase;
    margin-bottom:6px;
    display:block;
  }
  .section-card h2{
    font-family:'Space Grotesk', sans-serif;
    font-size:19px;
    font-weight:600;
    margin:0 0 6px;
  }
  .section-card p{
    color:var(--slate);
    font-size:14.5px;
    line-height:1.55;
    margin:0;
    font-family:'Source Serif 4', serif;
  }

  /* Question card */
  .q-card{
    background:var(--paper-raised);
    border:1px solid var(--hair);
    padding:28px 26px;
    border-radius:var(--radius);
    margin-bottom:24px;
  }
  .q-index{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--slate);
    letter-spacing:.06em;
    margin-bottom:10px;
  }
  .q-text{
    font-size:19px;
    line-height:1.5;
    margin:0 0 6px;
    font-weight:500;
  }
  .q-hint{
    color:var(--slate);
    font-size:14px;
    font-style:italic;
    margin:0 0 22px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    border:1px solid var(--hair);
    border-radius:var(--radius);
    background:var(--paper);
    cursor:pointer;
    font-family:'Space Grotesk', sans-serif;
    font-size:15px;
    color:var(--ink);
    transition:border-color .15s ease, background .15s ease;
    text-align:left;
  }
  .opt:hover{ border-color:var(--ink); }
  .opt:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
  .opt .mark{
    width:20px; height:20px;
    border-radius:50%;
    border:1.5px solid var(--slate);
    flex-shrink:0;
    position:relative;
  }
  .opt.selected{
    border-color:var(--ink);
    background:#EFEADA;
  }
  .opt.selected .mark{
    border-color:var(--ink);
    background:var(--ink);
  }
  .opt.selected .mark::after{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:50%;
    background:var(--paper-raised);
  }
  .opt .val{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--slate);
    margin-left:auto;
  }

  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
  }
  .btn{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:.02em;
    padding:13px 26px;
    border-radius:var(--radius);
    border:1px solid var(--ink);
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn-primary{ background:var(--ink); color:var(--paper-raised); }
  .btn-primary:disabled{ opacity:.35; cursor:not-allowed; }
  .btn-primary:not(:disabled):hover{ transform:translateY(-1px); }
  .btn-ghost{ background:transparent; color:var(--ink); border-color:var(--hair); }
  .btn-ghost:hover{ border-color:var(--ink); }

  /* Results */
  .results{ text-align:center; }
  .gauge-wrap{ margin: 8px auto 20px; max-width:340px; }
  .zone-label{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:12px;
    margin-top:6px;
  }
  .score-readout{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--slate);
    margin-top:2px;
  }
  .verdict-title{
    font-family:'Space Grotesk', sans-serif;
    font-size:24px;
    font-weight:600;
    margin:18px 0 10px;
  }
  .verdict-text{
    font-size:17px;
    line-height:1.65;
    color:var(--ink-70);
    text-align:left;
    max-width:52ch;
    margin:0 auto 28px;
  }
  .cta-card{
    border-top:1px solid var(--hair);
    padding-top:26px;
    margin-top:8px;
  }
  .cta-card p{
    color:var(--slate);
    font-size:14.5px;
    margin:0 0 16px;
  }
  a.btn-primary{
    display:inline-block;
    text-decoration:none;
  }
  .restart{
    display:block;
    margin:22px auto 0;
    background:none;
    border:none;
    color:var(--slate);
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
  }

  .brandfoot{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--slate);
    letter-spacing:.06em;
    margin-top:44px;
  }

  /* Lead capture */
  .lead-card{
    background:var(--paper-raised);
    border:1px solid var(--hair);
    border-radius:var(--radius);
    padding:24px 24px 26px;
    margin:26px 0;
    text-align:left;
  }
  .lead-card h3{
    font-family:'Space Grotesk', sans-serif;
    font-size:16px;
    font-weight:600;
    margin:0 0 6px;
  }
  .lead-card .sub{
    color:var(--slate);
    font-size:13.5px;
    margin:0 0 18px;
    line-height:1.5;
  }
  .field{
    margin-bottom:12px;
  }
  .field label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.04em;
    color:var(--slate);
    margin-bottom:5px;
  }
  .field input{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--hair);
    border-radius:var(--radius);
    background:var(--paper);
    font-family:'Source Serif 4', serif;
    font-size:15px;
    color:var(--ink);
  }
  .field input:focus{
    outline:none;
    border-color:var(--ink);
  }
  .lead-submit{
    width:100%;
    margin-top:6px;
  }
  .lead-note{
    font-size:12px;
    color:var(--slate);
    margin-top:10px;
    line-height:1.5;
  }
  .lead-success{
    text-align:center;
    padding:8px 0 2px;
  }
  .lead-success .check{
    font-size:22px;
    margin-bottom:8px;
    color:var(--ink);
  }
  .lead-success p{
    color:var(--ink-70);
    font-size:14.5px;
    margin:0;
  }

  @media (max-width:480px){
    .wrap{ padding:32px 18px 60px; }
    .q-card, .section-card{ padding:20px 18px; }
  }

  @media (prefers-reduced-motion: reduce){
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const SECTIONS = [
  { title:"Finding the Constraint", note:"Every system has exactly one thing limiting it. These questions locate it." },
  { title:"Is the Constraint Being Managed?", note:"Once you know where it is, the question becomes whether it's protected — or ignored." },
  { title:"Revenue, Margin & Working Capital", note:"Where profit and cash are actually being made or lost, once the constraint is accounted for." },
  { title:"Supply Chain & Planning Discipline", note:"Whether planning happens on evidence — or on habit." },
  { title:"Data & Readiness for What's Next", note:"Whether your numbers can be trusted enough to build on." }
];

const QUESTIONS = [
  { s:0, q:"Can you name the single biggest bottleneck in your business right now — the one thing that, if fixed, would unlock the most growth or margin?", hint:"Not a list. One thing." },
  { s:0, q:"Do you know where work or orders pile up in your business — the place where things wait longest before moving forward?" },
  { s:0, q:"Is your bottleneck a people/equipment limit, or a policy limit?", hint:"Score high if you can clearly say which. Many assume capacity when it's actually an outdated rule or approval step." },
  { s:0, q:"Has this bottleneck stayed the same for more than a year, as a deliberate decision rather than a blind spot?" },
  { s:1, q:"Is your bottleneck resource or process protected from downtime, changeovers, and low-value work — or does it often sit idle or get pulled onto things that don't matter?" },
  { s:1, q:"Do your other teams and processes work at the pace the bottleneck can absorb — rather than piling up work faster than it can clear, or leaving it starved?" },
  { s:1, q:"When you invest in fixing something, is it usually the bottleneck — rather than spend spread evenly regardless of where the real constraint sits?" },
  { s:2, q:"Do you know which products, customers, or services actually make you the most money — not by revenue, but by what they contribute after truly variable costs?" },
  { s:2, q:"Is your inventory sized to protect your bottleneck — rather than building up in places that don't matter while the bottleneck still runs dry?" },
  { s:2, q:"Can you calculate, in under a day, how a specific decision will affect overall profit — not just the department it touches?" },
  { s:3, q:"Does your business run a regular Sales & Operations Planning (S&OP) rhythm — a recurring, cross-functional forecast-vs-capacity review that actually changes decisions?" },
  { s:3, q:"Do you trust your demand forecast enough to plan against it — or does everyone quietly keep their own spreadsheet just in case?" },
  { s:3, q:"Is your ERP or SCM system actually used the way it was designed — or have people built manual workarounds because it doesn't reflect reality?" },
  { s:4, q:"If you pulled a report right now, would your leadership team trust the numbers in it — or would someone check the real numbers separately?" },
  { s:4, q:"Is your data clean and structured enough today that you could confidently layer AI-assisted forecasting or monitoring on top of it, without a major clean-up first?" }
];

const OPTIONS = [
  { v:0, label:"No / not sure" },
  { v:1, label:"Partially" },
  { v:2, label:"Yes, clearly" }
];

const FORMSPREE_ENDPOINT = "https://formspree.io/f/mnpqawgn";
let leadSubmitted = false;
let anonymousLogged = false;

let answers = new Array(QUESTIONS.length).fill(null);
let step = 0; // -1 = intro, 0..14 = questions, 99 = results
let showingSectionCard = -1; // section index just shown, to avoid repeat

const app = document.getElementById('app');

function render(){
  if (step === -1) return renderIntro();
  if (step === 99) return renderResults();
  return renderQuestion(step);
}

function renderIntro(){
  app.innerHTML = `
    <div class="eyebrow">
      <span class="brand">SAMAYARTHA ADVISORY</span>
      <span>CONSTRAINT DIAGNOSTIC</span>
    </div>
    <h1>Every business has one thing limiting its growth. Do you know what yours is?</h1>
    <p class="lede">Most organisations don't have ten problems — they have one real constraint, and nine symptoms of it. This 5-minute self-assessment is drawn from the same Theory-of-Constraints method we use in client diagnostics. Answer honestly; there's no perfect score, only a clearer picture of where to look first.</p>
    <div class="section-card">
      <span class="num">15 QUESTIONS · 5 SECTIONS · ~5 MIN</span>
      <h2>Before you start</h2>
      <p>Score each question by instinct, not by what should be true. The pattern across your answers matters more than any single one.</p>
    </div>
    <p style="font-size:13px; color:var(--slate); line-height:1.6; margin:-4px 0 24px;">Your answers are confidential — used only to generate your reading, and only shared with Samayartha if you choose to submit your details below.</p>
    <div class="nav-row" style="justify-content:flex-end;">
      <button class="btn btn-primary" id="beginBtn">Begin diagnostic →</button>
    </div>
  `;
  document.getElementById('beginBtn').onclick = ()=>{ step = 0; render(); };
}

function renderQuestion(i){
  const q = QUESTIONS[i];
  const sec = SECTIONS[q.s];
  const isFirstOfSection = i===0 || QUESTIONS[i-1].s !== q.s;

  const ticks = QUESTIONS.map((_, idx)=>{
    const cls = idx < i ? 'done' : (idx===i ? 'current' : '');
    return `<div class="tick ${cls}"></div>`;
  }).join('');

  let sectionHtml = '';
  if (isFirstOfSection){
    sectionHtml = `
      <div class="section-card">
        <span class="num">SECTION ${q.s+1} OF 5</span>
        <h2>${sec.title}</h2>
        <p>${sec.note}</p>
      </div>`;
  }

  const optsHtml = OPTIONS.map(o=>{
    const sel = answers[i] === o.v ? 'selected' : '';
    return `<button class="opt ${sel}" data-val="${o.v}">
        <span class="mark"></span>
        <span>${o.label}</span>
        <span class="val">${o.v}</span>
      </button>`;
  }).join('');

  app.innerHTML = `
    <div class="eyebrow">
      <span class="brand">SAMAYARTHA ADVISORY</span>
      <span>CONSTRAINT DIAGNOSTIC</span>
    </div>
    <div class="ticks">${ticks}</div>
    <div class="progress-label">QUESTION ${i+1} OF ${QUESTIONS.length}</div>
    ${sectionHtml}
    <div class="q-card">
      <div class="q-index">Q${i+1}</div>
      <p class="q-text">${q.q}</p>
      ${q.hint ? `<p class="q-hint">${q.hint}</p>` : ''}
      <div class="options">${optsHtml}</div>
    </div>
    <div class="nav-row">
      <button class="btn btn-ghost" id="backBtn" ${i===0 ? 'style="visibility:hidden"' : ''}>← Back</button>
      <button class="btn btn-primary" id="nextBtn" ${answers[i]===null ? 'disabled' : ''}>${i===QUESTIONS.length-1 ? 'See your reading →' : 'Next →'}</button>
    </div>
  `;

  app.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>{
      answers[i] = parseInt(btn.dataset.val, 10);
      render();
    };
  });
  document.getElementById('backBtn').onclick = ()=>{ step = Math.max(0, i-1); render(); };
  document.getElementById('nextBtn').onclick = ()=>{
    if (answers[i]===null) return;
    step = (i===QUESTIONS.length-1) ? 99 : i+1;
    render();
  };
}

function computeScore(){
  return answers.reduce((a,b)=> a + (b||0), 0);
}

function zoneFor(score){
  // score: 0-30 raw (higher = healthier). Convert to pressure for the gauge (higher pressure = worse).
  const pressure = 30 - score;
  if (score >= 24) return { key:'clear', label:'RUNNING CLEAR', color:'var(--ink)',
    title:"A genuinely disciplined operation.",
    text:"Your gains from here are usually in deliberately elevating the constraint — investing precisely where it matters — rather than firefighting. Most businesses at this stage benefit more from a second opinion than a full diagnostic." };
  if (score >= 14) return { key:'strain', label:'UNDER STRAIN', color:'var(--brass)',
    title:"You know the symptoms — the constraint itself is still unclear.",
    text:"This is the most common reading. You've likely identified pressure points, but haven't isolated the one true constraint — or you have, and haven't fully protected and subordinated everything else to it yet. This is exactly where a focused diagnostic finds fast, measurable wins." };
  return { key:'critical', label:'AT THE LIMIT', color:'var(--rust)',
    title:"A structural constraint is running your business without your input.",
    text:"This usually traces back to a policy or habit that hasn't been questioned in years — not a lack of effort. It's the scenario our half-day Constraint Diagnostic is built for: naming the constraint with evidence, not guesswork, in a single session." };
}

function gaugeSVG(score){
  const pressure = 30 - score; // 0 (best) .. 30 (worst)
  const pct = pressure / 30;
  const angle = -90 + pct * 180; // -90deg .. +90deg across the semicircle
  const cx = 150, cy = 150, r = 110;
  const zoneFillClear = 'var(--ink)';
  const zoneFillStrain = 'var(--brass)';
  const zoneFillCritical = 'var(--rust)';

  function arcPath(startDeg, endDeg){
    const toRad = d => (Math.PI/180) * d;
    const sx = cx + r*Math.cos(toRad(startDeg-90));
    const sy = cy + r*Math.sin(toRad(startDeg-90));
    const ex = cx + r*Math.cos(toRad(endDeg-90));
    const ey = cy + r*Math.sin(toRad(endDeg-90));
    const large = (endDeg-startDeg) > 180 ? 1 : 0;
    return `M ${sx} ${sy} A ${r} ${r} 0 ${large} 1 ${ex} ${ey}`;
  }
  // 3 zones across 180deg: clear 0-60, strain 60-120, critical 120-180 (mapped left→right, best→worst)
  const arcClear = arcPath(0,60);
  const arcStrain = arcPath(60,120);
  const arcCritical = arcPath(120,180);

  const needleLen = r - 20;
  const rad = (Math.PI/180)*(angle);
  const nx = cx + needleLen*Math.sin(rad);
  const ny = cy - needleLen*Math.cos(rad);

  return `
  <svg viewBox="0 0 300 175" width="100%" role="img" aria-label="Constraint pressure gauge">
    <path d="${arcClear}" fill="none" stroke="${zoneFillClear}" stroke-width="14" stroke-linecap="butt" opacity="0.85"/>
    <path d="${arcStrain}" fill="none" stroke="${zoneFillStrain}" stroke-width="14" stroke-linecap="butt" opacity="0.9"/>
    <path d="${arcCritical}" fill="none" stroke="${zoneFillCritical}" stroke-width="14" stroke-linecap="butt" opacity="0.9"/>
    <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" style="transition: all .8s cubic-bezier(.2,.8,.2,1);"/>
    <circle cx="${cx}" cy="${cy}" r="7" fill="var(--ink)"/>
    <text x="10" y="168" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--slate)">CLEAR</text>
    <text x="255" y="168" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--slate)">CRITICAL</text>
  </svg>`;
}

function answersSummary(){
  return QUESTIONS.map((q,i)=> `Q${i+1} [${SECTIONS[q.s].title}]: ${answers[i]} — ${q.q}`).join('\n');
}

function logAnonymous(score, zone){
  if (anonymousLogged) return;
  anonymousLogged = true;
  try{
    fetch(FORMSPREE_ENDPOINT, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Accept":"application/json" },
      body: JSON.stringify({
        _subject: `Diagnostic completed (anonymous) — ${zone.label} — score ${score}/30`,
        type: "anonymous_completion",
        score: score,
        zone: zone.label,
        answers: answersSummary()
      })
    }).catch(()=>{});
  }catch(e){}
}

function submitLead(score, zone, name, email, company){
  return fetch(FORMSPREE_ENDPOINT, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Accept":"application/json" },
    body: JSON.stringify({
      _subject: `New Constraint Diagnostic lead — ${name} — ${zone.label} (${score}/30)`,
      type: "lead",
      name: name,
      email: email,
      company: company || "(not provided)",
      score: score,
      zone: zone.label,
      answers: answersSummary()
    })
  });
}

function renderResults(){
  const score = computeScore();
  const zone = zoneFor(score);

  logAnonymous(score, zone);

  const leadBlockHtml = leadSubmitted ? `
      <div class="lead-card">
        <div class="lead-success">
          <div class="check">✓</div>
          <p>Thanks — we've received your reading. We'll be in touch, or you can reach out directly below.</p>
        </div>
      </div>` : `
      <div class="lead-card">
        <h3>Get your reading sent to you</h3>
        <p class="sub">Leave your details and we'll follow up with what this reading typically means for a business like yours.</p>
        <form id="leadForm">
          <div class="field">
            <label for="leadName">NAME</label>
            <input type="text" id="leadName" required />
          </div>
          <div class="field">
            <label for="leadEmail">EMAIL</label>
            <input type="email" id="leadEmail" required />
          </div>
          <div class="field">
            <label for="leadCompany">COMPANY (OPTIONAL)</label>
            <input type="text" id="leadCompany" />
          </div>
          <button type="submit" class="btn btn-primary lead-submit" id="leadSubmitBtn">Send me my results →</button>
          <p class="lead-note">Confidential — used only to follow up on your diagnostic, never shared or sold. No spam.</p>
        </form>
      </div>`;

  app.innerHTML = `
    <div class="eyebrow">
      <span class="brand">SAMAYARTHA ADVISORY</span>
      <span>YOUR READING</span>
    </div>
    <div class="results">
      <div class="gauge-wrap">${gaugeSVG(score)}</div>
      <div class="zone-label" style="color:${zone.color}">${zone.label}</div>
      <div class="score-readout">SCORE ${score} / 30</div>
      <h2 class="verdict-title">${zone.title}</h2>
      <p class="verdict-text">${zone.text}</p>
      ${leadBlockHtml}
      <div class="cta-card">
        <p>Not sure how to read your own answers? That's normal — it's hard to see the constraint from inside it. A short conversation, or our half-day Constraint Diagnostic session, will identify it with evidence.</p>
        <a class="btn btn-primary" href="https://www.samayartha.com/contact">Start a conversation →</a>
      </div>
      <button class="restart" id="restartBtn">Retake the diagnostic</button>
    </div>
    <div class="brandfoot">SAMAYARTHA ADVISORY · RIGHT STRUCTURE, RIGHT TIME</div>
  `;

  const leadForm = document.getElementById('leadForm');
  if (leadForm){
    leadForm.onsubmit = (e)=>{
      e.preventDefault();
      const name = document.getElementById('leadName').value.trim();
      const email = document.getElementById('leadEmail').value.trim();
      const company = document.getElementById('leadCompany').value.trim();
      if (!name || !email) return;
      const btn = document.getElementById('leadSubmitBtn');
      btn.disabled = true;
      btn.textContent = "Sending...";
      submitLead(score, zone, name, email, company)
        .then(()=>{ leadSubmitted = true; renderResults(); })
        .catch(()=>{ btn.disabled = false; btn.textContent = "Send me my results →"; });
    };
  }

  document.getElementById('restartBtn').onclick = ()=>{
    answers = new Array(QUESTIONS.length).fill(null);
    leadSubmitted = false;
    anonymousLogged = false;
    step = -1;
    render();
  };
}

render();
</script>
</body>
</html>
